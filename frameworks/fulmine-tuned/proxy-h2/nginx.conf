# fulmine gateway edge, HTTP/2.
#
# Stock nginx terminates TLS and h2 on 8443, serves /static/* off disk and
# forwards everything else to the fulmine server over loopback h1 with a
# keepalive pool, so the streams arriving multiplexed on one h2 connection fan
# out across the backend workers instead of queueing behind one upstream.
#
# nginx and not Caddy, which is what this edge was until now. The profile
# scores the pair, and the edge was the half that ran out: Caddy answered 91k
# rps at a p99 of 3.10s while holding 4105% of the 6400% the two containers are
# allowed between them, so the server sat idle behind a queue. The same shape
# is visible board-wide - every Caddy-fronted entry lands near 80k with a
# multi-second p99, and the one entry that puts nginx in front of an otherwise
# comparable server answers 312k at a p99 of 54ms.
#
# gateway-h3 keeps Caddy, in proxy-h3/: nginx has no QUIC listener in the stock
# image, and h3 is the profile where Caddy is already at the top of the board.
#
# Everything below is what the aspnet-minimal + nginx entry runs, which is the
# published configuration this swap is reasoned from - deliberately, so that
# what changes between the old numbers and the new ones is the proxy and not a
# tuning pass on top of it. worker_processes and the CPU split (PROXY_CPUSET /
# SERVER_CPUSET in compose.gateway.yml) are the knobs to sweep after, one at a
# time.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # The .gz sidecars the harness leaves on disk next to the originals, so a
    # compressed static body is a file read rather than a compression. The load
    # generator asks for br first and gzip second; stock nginx carries no
    # brotli module, so gzip is the one it can answer off disk.
    gzip_static on;
    gzip_vary   on;

    keepalive_timeout  65;
    keepalive_requests 10000;

    access_log off;
    error_log  /dev/stderr warn;

    upstream backend {
        server 127.0.0.1:8080;
        keepalive 2048;
        keepalive_requests 100000;
        keepalive_timeout 300s;
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # The profile asks the edge to serve these from disk rather than
        # forward them. (/static/foo -> /data/static/foo.)
        location /static/ {
            alias /data/static/;
            expires off;
            add_header Cache-Control "no-cache";
        }

        # Everything else is the fulmine server: /baseline2, /json/{count} and
        # /async-db. A prefix location is longer than this one, so /static/ is
        # matched first and a missing file 404s here rather than reaching the
        # server.
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
