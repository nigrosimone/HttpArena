# gateway-64 - stock nginx (TLS + h2 on 8443) in front of the fulmine server,
# forwarding the dynamic endpoints over loopback h1 with keepalive. The server
# gets no certs here, so it comes up cleartext on 8080 only.
#
# The edge used to be Caddy and is nginx from this commit; proxy-h2/nginx.conf
# carries the reasoning and the numbers. gateway-h3 keeps Caddy, in proxy-h3/.
#
# The CPU split is the knob worth sweeping next, via PROXY_CPUSET /
# SERVER_CPUSET, and it is left where Caddy had it so that this run measures
# the proxy alone. Terminating TLS under multiplexed h2 was the heavier half
# with Caddy in front; nginx may well want less of the budget than the server.
services:
  proxy:
    build:
      context: ./proxy-h2
    network_mode: host
    cpuset: "${PROXY_CPUSET:-0-15,64-79}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    cpuset: "${SERVER_CPUSET:-16-31,80-95}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=256
      - DATASET_PATH=/data/dataset.json
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
      - ${DATA_DIR}/static:/data/static:ro
