# fulmine production-stack edge.
#
# nginx terminates TLS and h2 on 8443 and splits the three paths the profile
# defines: /static/* off disk here, /public/* straight to the server, /api/*
# past the shared JWT verifier first. The server itself never sees a token,
# only the X-User-Id that survives.
#
# nginx and not Caddy, which is what this edge was until now, for the reason
# the gateway edge changed with it: the edge is the half of this stack that
# saturates, and the one it is measured against answers 228k rps at a p99 of
# 20ms where this stack answered 59k at 1.12s, with a third of the CPU budget
# left unspent behind the queue. See proxy-h2/nginx.conf.
#
# auth_request is nginx's forward_auth: an internal GET subrequest to authsvc
# per /api/* call, carrying the caller's Authorization header and nothing else.
# authsvc answers 200 with X-User-Id or 401, and a 401 ends the request here,
# so an unauthenticated /api/* never reaches the server. No proxy_cache on it -
# the HMAC verification on every request is what the profile is measuring.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    gzip_static on;
    gzip_vary   on;

    keepalive_timeout  65;
    keepalive_requests 10000;

    access_log off;
    error_log  /dev/stderr warn;

    upstream backend {
        server 127.0.0.1:8080;
        keepalive 2048;
        keepalive_requests 100000;
        keepalive_timeout 300s;
    }

    upstream authsvc {
        server 127.0.0.1:9090;
        keepalive 256;
        keepalive_requests 100000;
        keepalive_timeout 300s;
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # What the subrequest answered with, for the proxied request below.
        auth_request_set $auth_user_id $upstream_http_x_user_id;

        # The subrequest itself. The body is not forwarded: authsvc verifies a
        # signature on the Authorization header and reads nothing else, and a
        # POST /api/items/{id} would otherwise send its JSON twice.
        location = /_auth {
            internal;
            proxy_pass http://authsvc/_auth;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location /static/ {
            alias /data/static/;
            expires off;
            add_header Cache-Control "no-cache";
        }

        location /public/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /api/ {
            auth_request /_auth;
            error_page 401 = @unauthorized;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-User-Id $auth_user_id;
        }

        location @unauthorized {
            add_header Content-Type "application/json" always;
            return 401 '{"error":"unauthorized"}';
        }
    }
}
